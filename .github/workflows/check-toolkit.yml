name: Check Markdown toolkit
on:
  push:
    paths: ['README.md', 'docs/**', 'toolkit/**', 'scripts/check-toolkit.mjs', '.github/workflows/check-toolkit.yml']
  pull_request:
    paths: ['README.md', 'docs/**', 'toolkit/**', 'scripts/check-toolkit.mjs', '.github/workflows/check-toolkit.yml']
permissions:
  contents: read
jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: node scripts/check-toolkit.mjs
